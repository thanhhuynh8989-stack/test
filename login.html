<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - Hệ Thống Quản Lý Đề Thi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { background: #fff; padding: 32px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; width: 100%; max-width: 400px; }
    .login-card h2 { text-align: center; color: #0f172a; margin-bottom: 24px; font-size: 22px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 14px; font-weight: 600; color: #475569; margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
    .form-group input:focus { border-color: #2563eb; ring: 2px #bfdbfe; }
    .btn-login { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: 600; font-size: 15px; cursor: pointer; transition: background 0.2s; }
    .btn-login:hover { background: #1d4ed8; }
    .error-msg { color: #dc2626; font-size: 13px; margin-top: 12px; text-align: center; display: none; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>🔑 Đăng Nhập Hệ Thống</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Tài khoản</label>
        <input type="text" id="username" placeholder="Nhập username hoặc 'admin'" required>
      </div>
      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu" required>
      </div>
      <button type="submit" class="btn-login" id="btnLogin">Đăng Nhập</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
